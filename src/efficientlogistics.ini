; Efficient Logistics - construction office and supply base trucks fill up
; and deliver to several sites or storages in one trip.
; UTF-8 without BOM. Restart the game after a change.

[efficientlogistics]

; 0 = the plugin loads, does nothing and unloads.
enabled = 1

; How many more sites a truck may serve after the one the office chose.
; 0 = the game as it is.
max_extra_sites = 3

; Only sites within this distance (m) of the first one. 0 = any of the office's sites.
max_distance_m = 0

; A site or storage is added only when it wants at least this much (t) and
; the truck has at least this much room left. Small is better: a rest left
; out here makes the office send a truck for it alone later.
min_extra_t = 0.1

; Loaded on top of what the sites need (t, 0 - 1). The last site takes it -
; a site accepts up to its need + 1 t - so no truck is sent again for the
; few hundredths of a tonne lost on the way.
load_margin_t = 0.2

; 1 = what is left on board after the last site of a trip (the margin above,
; or a site that took less) is thrown away, so the truck comes back empty and
; can take any job. 0 = it keeps it, as in the game.
clear_rest = 1

; Debugging only: 1 = every delivery goes to the RML log (the stops added,
; or why none was). Start-up and error messages are logged anyway.
log = 0

; 1 = road distribution office trucks serve several destinations too: other
; storages that want the same resource from the same source.
logistics = 1

; Research only: 1 = the stops other vehicles (distribution offices ...) get
; go to the RML log, the first 400.
trace_others = 0
