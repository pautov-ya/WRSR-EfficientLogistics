; constructlog - construction office trucks deliver to several sites in one trip.
; UTF-8 without BOM. Restart the game after a change.

[constructlog]

; 0 = the plugin loads, does nothing and unloads.
enabled = 1

; How many more sites a truck may serve after the one the office chose.
; 0 = the game as it is.
max_extra_sites = 3

; Only sites within this distance (m) of the first one. 0 = any of the office's sites.
max_distance_m = 0

; A site is added only when it needs at least this much (t) and the truck has
; at least this much room left.
min_extra_t = 1

; Office jobs that may take several sites: 1 gravel, 2 bricks, 3 steel,
; 4 boards, 5 asphalt, 6 concrete, 9 prefab panels, 10 mechanical components,
; 11 electrical components.
jobs = 1,2,3,4,5,6,9,10,11

; 1 = every multi-site trip goes to the RML log.
log = 1
