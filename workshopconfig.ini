$ITEM_NAME "Efficient Logistics | Эффективная логистика"

$ITEM_DESC "[h1]Efficient Logistics[/h1]

Trucks of construction offices and supply bases load up and serve several places in one trip.

[h2]Construction offices[/h2]
In the base game, a construction office truck loads only what one site needs. With a 20 t truck and sites that need 5 t, 2 t and 10 t of gravel, it makes three trips. With Efficient Logistics it loads 17 t and drops at all three sites on the way.

[h2]Supply bases[/h2]
The same for a road supply base: a truck taking one resource from a storage to a smaller one also serves the other storages, shops and buildings that want that resource from the same source.

The mod does not write anything into the save and can be removed at any time. Settings are in [b]efficientlogistics.ini[/b].

[h2]Requirements[/h2]
[list]
[*] Game version [b]1.1.1.9[/b], 64-bit.
[*] [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3787969749]Republic Mod Loader[/url]: start the game from it, with [b]efficientlogistics[/b] enabled under Plugins.
[/list]

[h2]Alternative: TesmioLoader[/h2]
The mod also works with [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3773169177]TesmioLoader[/url] instead of RML.
[olist]
[*] Copy the [b]tesmioloader[/b] folder from the TesmioLoader Workshop folder (784150\3773169177) into the game folder, next to media_soviet.
[*] Copy [b]efficientlogistics.dll[/b] and [b]efficientlogistics.ini[/b] from this mod's plugins folder (784150\3825558097\plugins) into tesmioloader\build\plugins.
[*] Start Steam, then tesmioloader\build\tesmiolauncher.exe.
[/olist]
After an update of the mod, copy efficientlogistics.dll again.

[h2]Known limitations[/h2]
[list]
[*] Trip plans are kept in memory only: after loading a save, trucks already on a several-stop trip are counted the game's way, so the office may send one extra truck.
[*] Tested with road supply bases. Rail and other distribution offices are left as they are.
[/list]

Found a bug? Report it in the comments here or on [url=https://github.com/pautov-ya/WRSR-EfficientLogistics/issues]GitHub[/url].
Source code: [url=https://github.com/pautov-ya/WRSR-EfficientLogistics]GitHub[/url]. License: GPL v3.

[h1]Эффективная логистика[/h1]

Грузовики стройконтор и баз снабжения загружаются полностью и развозят груз по нескольким адресам за один рейс.

[h2]Стройконторы[/h2]
В обычной игре грузовик стройконторы берет ровно столько, сколько нужно одной стройке. Если самосвал везет 20 т, а стройкам нужно 5 т, 2 т и 10 т щебня, он сделает три рейса. С модом он берет 17 т и по пути заезжает на все три стройки.

[h2]Базы снабжения[/h2]
То же для автомобильной базы снабжения. Грузовик, который везет ресурс со склада на склад поменьше, заодно обслуживает другие склады, магазины и здания, которым нужен этот ресурс с того же склада.

Мод ничего не пишет в сохранение, его можно убрать в любой момент. Настройки лежат в [b]efficientlogistics.ini[/b].

[h2]Что нужно[/h2]
[list]
[*] Игра версии [b]1.1.1.9[/b], 64-бит.
[*] [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3787969749]Republic Mod Loader[/url]: запускайте игру через него, с включенным [b]efficientlogistics[/b] на вкладке Plugins.
[/list]

[h2]Другой вариант: TesmioLoader[/h2]
Мод работает и с [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3773169177]TesmioLoader[/url] вместо RML.
[olist]
[*] Скопируйте папку [b]tesmioloader[/b] из папки TesmioLoader в Workshop (784150\3773169177) в папку игры, рядом с media_soviet.
[*] Скопируйте [b]efficientlogistics.dll[/b] и [b]efficientlogistics.ini[/b] из папки plugins этого мода (784150\3825558097\plugins) в tesmioloader\build\plugins.
[*] Запустите Steam, затем tesmioloader\build\tesmiolauncher.exe.
[/olist]
После обновления мода скопируйте efficientlogistics.dll заново.

[h2]Известные ограничения[/h2]
[list]
[*] План рейса хранится только в памяти: после загрузки сохранения грузовики, которые уже в рейсе на несколько остановок, считаются по правилам игры, и контора может отправить одну лишнюю машину.
[*] Проверено на автомобильных базах снабжения. Железнодорожные и другие конторы распределения мод не трогает.
[/list]

Нашли ошибку? Напишите в комментариях здесь или на [url=https://github.com/pautov-ya/WRSR-EfficientLogistics/issues]GitHub[/url].
Исходный код: [url=https://github.com/pautov-ya/WRSR-EfficientLogistics]GitHub[/url]. Лицензия: GPL v3."

